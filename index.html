<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Приём заказов</title>
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--ink:#1c1f24;--muted:#646b75;--line:#dde1e6;
  --accent:#2563eb;--accent-soft:#e6eefc;--warn:#b45309;--warn-soft:#fdf1e2;
  --bad:#b91c1c;--bad-soft:#fdeaea;--ok:#15803d;--ok-soft:#e5f5ea;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121417;--card:#1c1f24;--ink:#e8eaed;--muted:#9aa1ab;--line:#30353c;
  --accent:#6b9bff;--accent-soft:#1d2a44;--warn:#f0a54a;--warn-soft:#3a2a14;
  --bad:#f07171;--bad-soft:#3d1b1b;--ok:#5cc982;--ok-soft:#163222;
}}
:root[data-theme="dark"]{
  --bg:#121417;--card:#1c1f24;--ink:#e8eaed;--muted:#9aa1ab;--line:#30353c;
  --accent:#6b9bff;--accent-soft:#1d2a44;--warn:#f0a54a;--warn-soft:#3a2a14;
  --bad:#f07171;--bad-soft:#3d1b1b;--ok:#5cc982;--ok-soft:#163222;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:12px;padding:12px 0 4px}
.top h1{font-size:18px;margin:0}
.demo{font-size:12px;color:var(--warn);background:var(--warn-soft);padding:2px 8px;border-radius:99px}
nav{display:flex;gap:4px;overflow-x:auto;padding:4px 0 0}
nav button{border:0;background:none;color:var(--muted);padding:10px 12px;font:inherit;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
main{padding:16px 0 48px}
h2{font-size:17px;margin:24px 0 8px}
h2:first-child{margin-top:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
label.f{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
textarea{min-height:60px;resize:vertical}
button.b{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 14px;cursor:pointer}
button.b.p{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.b.s{padding:6px 10px;font-size:13px}
button.b.danger{color:var(--bad)}
button.b:disabled{opacity:.5;cursor:default}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;white-space:nowrap}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.alert{border-radius:8px;padding:10px 12px;margin:10px 0}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.line{display:grid;grid-template-columns:1fr 96px 36px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.line .name{font-weight:500}
.empty{color:var(--muted);padding:8px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20;max-width:90vw}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}.line{grid-template-columns:1fr 80px 36px}}
.scroll{overflow-x:auto}
a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top"><h1>Приём заказов</h1><span class="demo">демо · выдуманные данные</span></div>
    <nav id="nav"></nav>
  </div>
</header>
<main class="wrap" id="app"></main>

<script>
// Старый калькулятор ставил service worker на этот адрес — снимаем его, чтобы не показывался кэш.
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});

const KEY = 'zakazy-demo-v1';
const FRIDGES = {f1: 'Холодильник №1', f2: 'Холодильник №2', f3: 'Холодильник №3'};
const short = f => FRIDGES[f].replace('Холодильник ', '');
const REASONS = ['Истёк срок годности', 'Брак / качество', 'Привезли не тот товар', 'Не продали (излишек)', 'Повреждена упаковка', 'Другое'];

// ---------- даты ----------
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = () => iso(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const diffDays = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
const WD = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
const fmt = s => { const d = new Date(s + 'T12:00:00'); return `${WD[d.getDay()]} ${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}`; };

// ---------- данные ----------
function seed() {
  const t = today();
  const products = [
    {id: 'p1', code: '000101', name: 'Фарш говяжий охл.', group: 'Полуфабрикаты', unit: 'кг', fridge: 'f1', lead: 3},
    {id: 'p2', code: '000102', name: 'Фарш свино-говяжий охл.', group: 'Полуфабрикаты', unit: 'кг', fridge: 'f1', lead: 3},
    {id: 'p3', code: '000103', name: 'Котлеты домашние охл.', group: 'Полуфабрикаты', unit: 'кг', fridge: 'f1', lead: 3},
    {id: 'p4', code: '000104', name: 'Шашлык свиной маринованный', group: 'Полуфабрикаты', unit: 'кг', fridge: 'f1', lead: 3},
    {id: 'p5', code: '000105', name: 'Гуляш говяжий охл.', group: 'Полуфабрикаты', unit: 'кг', fridge: 'f1', lead: 3},
    {id: 'p6', code: '000201', name: 'Колбаса «Докторская» вар.', group: 'Варёные колбасы', unit: 'кг', fridge: 'f2', lead: 4},
    {id: 'p7', code: '000202', name: 'Колбаса «Молочная» вар.', group: 'Варёные колбасы', unit: 'кг', fridge: 'f2', lead: 4},
    {id: 'p8', code: '000203', name: 'Сосиски «Молочные»', group: 'Варёные колбасы', unit: 'кг', fridge: 'f2', lead: 4},
    {id: 'p9', code: '000204', name: 'Сардельки свиные', group: 'Варёные колбасы', unit: 'кг', fridge: 'f2', lead: 4},
    {id: 'p10', code: '000301', name: 'Колбаса п/к «Краковская»', group: 'Копчёности', unit: 'кг', fridge: 'f3', lead: 5},
    {id: 'p11', code: '000302', name: 'Колбаса с/к «Сервелат»', group: 'Копчёности', unit: 'кг', fridge: 'f3', lead: 5},
    {id: 'p12', code: '000303', name: 'Грудинка копчёная', group: 'Копчёности', unit: 'кг', fridge: 'f3', lead: 5},
  ];
  const clients = [
    {id: 'c1', name: 'Магазин А', type: 'Магазин'},
    {id: 'c2', name: 'Магазин Б', type: 'Магазин'},
    {id: 'c3', name: 'Кафе В', type: 'Общепит'},
    {id: 'c4', name: 'Столовая Г', type: 'Общепит'},
    {id: 'c5', name: 'Опт Д', type: 'Опт'},
    {id: 'c6', name: 'Магазин Е', type: 'Магазин'},
  ];
  const o = (id, clientId, created, ship, items, extra = {}) =>
    ({id, clientId, createdAt: created, shipDate: ship, items: items.map(([productId, qty]) => ({productId, qty})), source: 'client', status: 'accepted', note: '', in1c: false, ...extra});
  const orders = [
    o('o1', 'c1', addDays(t, -9), addDays(t, -5), [['p1', 12], ['p6', 8], ['p8', 6]], {in1c: true}),
    o('o2', 'c2', addDays(t, -8), addDays(t, -4), [['p2', 10], ['p7', 6], ['p10', 4]], {in1c: true}),
    o('o3', 'c3', addDays(t, -7), addDays(t, -3), [['p3', 15], ['p5', 10]], {in1c: true}),
    o('o4', 'c5', addDays(t, -10), addDays(t, -2), [['p1', 40], ['p2', 40], ['p6', 30], ['p11', 12]], {in1c: true}),
    o('o5', 'c1', addDays(t, -1), addDays(t, 4), [['p1', 12], ['p6', 8], ['p8', 8]]),
    o('o6', 'c3', addDays(t, -1), addDays(t, 3), [['p3', 15], ['p5', 12], ['p4', 8]], {in1c: true}),
    o('o7', 'c5', addDays(t, 0), addDays(t, 6), [['p1', 40], ['p2', 35], ['p6', 30], ['p11', 15]]),
    o('o8', 'c4', addDays(t, 0), addDays(t, 1), [['p3', 20], ['p9', 6]], {status: 'review', source: 'manager', note: ''}),
    o('o9', 'c2', addDays(t, 0), addDays(t, 5), [['p2', 10], ['p7', 6], ['p10', 5]], {status: 'review', note: 'Фарш нужен в упаковке по 1 кг'}),
  ];
  const returns = [
    {id: 'r1', clientId: 'c1', date: addDays(t, -6), productId: 'p8', qty: 2, reason: 'Истёк срок годности'},
    {id: 'r2', clientId: 'c2', date: addDays(t, -4), productId: 'p7', qty: 1.5, reason: 'Не продали (излишек)'},
    {id: 'r3', clientId: 'c3', date: addDays(t, -3), productId: 'p5', qty: 3, reason: 'Брак / качество'},
    {id: 'r4', clientId: 'c1', date: addDays(t, -2), productId: 'p6', qty: 2, reason: 'Привезли не тот товар'},
    {id: 'r5', clientId: 'c6', date: addDays(t, -1), productId: 'p8', qty: 3, reason: 'Истёк срок годности'},
  ];
  return {products, clients, orders, returns, reminded: {}};
}

let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { S = null; }
if (!S || !Array.isArray(S.orders)) S = seed();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

const P = id => S.products.find(p => p.id === id);
const C = id => S.clients.find(c => c.id === id);
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[ch]));
const num = n => String(Math.round(n * 100) / 100).replace('.', ',');
const $ = id => document.getElementById(id);
function toast(t) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2200); }

// Заказ поздний, если до отгрузки меньше дней, чем нужно на самую долгую позицию.
function lateness(order) {
  const need = Math.max(...order.items.map(i => P(i.productId).lead));
  const left = diffDays(order.createdAt, order.shipDate);
  return {need, left, late: left < need};
}

// ---------- навигация ----------
const TABS = [
  ['client', 'Заказ клиента'],
  ['manager', 'Менеджер'],
  ['prod', 'Производство'],
  ['returns', 'Возвраты'],
  ['about', 'О демо'],
];
let tab = 'client';
let form = null; // состояние открытой формы заказа
const clientOnly = () => location.hash.startsWith('#client=');

function renderNav() {
  const nav = $('nav');
  if (clientOnly()) { nav.innerHTML = ''; return; }
  nav.innerHTML = TABS.map(([k, t]) => `<button class="${k === tab ? 'on' : ''}" data-tab="${k}">${t}</button>`).join('');
  nav.querySelectorAll('button').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
}

function render() {
  renderNav();
  const app = $('app');
  if (clientOnly()) {
    const id = location.hash.slice(8);
    if (!C(id)) { app.innerHTML = '<p>Ссылка не найдена.</p>'; return; }
    if (!form || form.clientId !== id || form.mode !== 'client') form = newForm(id, 'client');
    app.innerHTML = renderForm(true);
    bindForm();
    return;
  }
  ({client: renderClientTab, manager: renderManager, prod: renderProd, returns: renderReturns, about: renderAbout})[tab]();
}
window.addEventListener('hashchange', () => { form = null; render(); });

// ---------- форма заказа ----------
function newForm(clientId, mode) {
  const last = S.orders.filter(o => o.clientId === clientId).sort((a, b) => a.createdAt < b.createdAt ? 1 : -1)[0];
  return {
    clientId, mode,
    shipDate: addDays(today(), 5),
    items: last ? last.items.map(i => ({...i})) : [],
    note: '',
    prefilled: !!last,
    done: null,
  };
}

function productOptions(exclude) {
  const groups = [...new Set(S.products.map(p => p.group))];
  return '<option value="">+ Добавить товар из списка…</option>' + groups.map(g =>
    `<optgroup label="${esc(g)}">` + S.products.filter(p => p.group === g && !exclude.includes(p.id))
      .map(p => `<option value="${p.id}">${esc(p.name)} · ${p.code}</option>`).join('') + '</optgroup>').join('');
}

function renderForm(standalone) {
  const f = form, c = C(f.clientId);
  if (f.done) {
    const o = f.done, l = lateness(o);
    return `<div class="card">
      <h2>Заказ принят</h2>
      <p>${esc(c.name)} · отгрузка <b>${fmt(o.shipDate)}</b> · позиций: ${o.items.length}</p>
      ${o.status === 'review'
        ? `<div class="alert warn">${l.late ? `До отгрузки ${l.left} дн., а на производство нужно ${l.need}. ` : ''}${o.note ? 'Есть комментарий. ' : ''}Менеджер подтвердит заказ.</div>`
        : '<div class="alert ok">Заказ передан в производство.</div>'}
      <button class="b" id="fAgain">Оформить ещё один заказ</button>
    </div>`;
  }
  const used = f.items.map(i => i.productId);
  const draft = {createdAt: today(), shipDate: f.shipDate, items: f.items};
  const l = f.items.length ? lateness(draft) : null;
  return `<div class="card">
    <div class="row"><div class="grow"><h2 style="margin:0">${esc(c.name)}</h2>
      <div class="muted small">${f.mode === 'manager' ? 'Менеджер вносит заказ по телефону' : 'Личная ссылка клиента'}</div></div></div>
    ${f.prefilled ? '<div class="alert ok small">Подставлен ваш прошлый заказ. Поправьте количество и дату.</div>' : ''}
    <div style="margin:12px 0">
      <label class="f" for="fDate">Дата отгрузки</label>
      <input type="date" id="fDate" value="${f.shipDate}" min="${today()}" style="max-width:220px">
      ${l && l.late ? `<div class="alert warn small">Поздний заказ: до отгрузки ${l.left} дн., а на производство нужно ${l.need}. Его подтвердит менеджер.</div>` : ''}
    </div>
    <div>${f.items.length ? f.items.map((it, i) => {
      const p = P(it.productId);
      return `<div class="line"><div><div class="name">${esc(p.name)}</div>
        <div class="muted small">код ${p.code} · <span class="tag">${FRIDGES[p.fridge]}</span></div></div>
        <input type="number" inputmode="decimal" min="0" step="0.5" value="${it.qty}" data-qty="${i}" aria-label="Количество, ${p.unit}">
        <button class="b s danger" data-del="${i}" aria-label="Убрать">✕</button></div>`;
    }).join('') : '<div class="empty">Пока ничего не выбрано.</div>'}</div>
    <div style="margin:12px 0"><select id="fAdd">${productOptions(used)}</select>
      <div class="muted small" style="margin-top:4px">Товар выбирается только из списка, холодильник подставляется сам. Количество в кг.</div></div>
    <label class="f" for="fNote">Комментарий (нарезка, фасовка и т.п.) — заказ с комментарием проверит менеджер</label>
    <textarea id="fNote">${esc(f.note)}</textarea>
    <div class="row" style="margin-top:12px"><button class="b p" id="fSend">Отправить заказ</button>
      ${!standalone && f.mode === 'manager' ? '<button class="b" id="fCancel">Отмена</button>' : ''}</div>
  </div>`;
}

function bindForm() {
  const f = form;
  if (f.done) { $('fAgain').onclick = () => { form = newForm(f.clientId, f.mode); render(); }; return; }
  $('fDate').onchange = e => { f.shipDate = e.target.value; render(); };
  $('fAdd').onchange = e => { if (e.target.value) { f.items.push({productId: e.target.value, qty: 1}); render(); } };
  $('fNote').oninput = e => { f.note = e.target.value; };
  document.querySelectorAll('[data-qty]').forEach(el => el.oninput = () => { f.items[+el.dataset.qty].qty = parseFloat(el.value.replace(',', '.')) || 0; });
  document.querySelectorAll('[data-del]').forEach(el => el.onclick = () => { f.items.splice(+el.dataset.del, 1); render(); });
  if ($('fCancel')) $('fCancel').onclick = () => { form = null; tab = 'manager'; render(); };
  $('fSend').onclick = () => {
    const items = f.items.filter(i => i.qty > 0);
    if (!items.length) return toast('Добавьте хотя бы одну позицию');
    if (!f.shipDate || f.shipDate < today()) return toast('Выберите дату отгрузки');
    const o = {id: uid('o'), clientId: f.clientId, createdAt: today(), shipDate: f.shipDate, items: items.map(i => ({...i})),
      source: f.mode, note: f.note.trim(), in1c: false, status: 'accepted'};
    if (lateness(o).late || o.note) o.status = 'review';
    S.orders.push(o); save();
    f.done = o; render();
  };
}

function renderClientTab() {
  if (!form) form = newForm(S.clients[0].id, 'client');
  $('app').innerHTML = `
    ${form.mode === 'client' ? `<div class="card"><label class="f" for="pick">В демо можно посмотреть форму глазами любого клиента</label>
      <div class="row"><select id="pick" class="grow">${S.clients.map(c => `<option value="${c.id}" ${c.id === form.clientId ? 'selected' : ''}>${esc(c.name)} (${c.type})</option>`).join('')}</select>
      <a href="#client=${form.clientId}" target="_blank" class="small">Открыть как личную ссылку ↗</a></div></div>` : ''}
    ${renderForm(false)}`;
  if ($('pick')) $('pick').onchange = e => { form = newForm(e.target.value, 'client'); render(); };
  bindForm();
}

// ---------- менеджер ----------
function orderLines(o) {
  return `<table><thead><tr><th>Код</th><th>Наименование</th><th class="n">Кол-во, кг</th><th>Холод.</th></tr></thead><tbody>${
    o.items.map(i => { const p = P(i.productId); return `<tr><td>${p.code}</td><td>${esc(p.name)}</td><td class="n">${num(i.qty)}</td><td>${short(p.fridge)}</td></tr>`; }).join('')
  }</tbody></table>`;
}

function renderManager() {
  const t = today();
  const review = S.orders.filter(o => o.status === 'review');
  const for1c = S.orders.filter(o => o.status === 'accepted' && !o.in1c).sort((a, b) => a.shipDate < b.shipDate ? -1 : 1);
  const horizon = addDays(t, 7);
  const silent = S.clients.filter(c => !S.orders.some(o => o.clientId === c.id && o.status !== 'rejected' && o.shipDate >= t && o.shipDate <= horizon));

  $('app').innerHTML = `
    <h2>Нужно решение <span class="tag ${review.length ? 'warn' : 'ok'}">${review.length}</span></h2>
    ${review.length ? review.map(o => { const l = lateness(o); return `<div class="card">
      <div class="row"><b class="grow">${esc(C(o.clientId).name)}</b><span>отгрузка ${fmt(o.shipDate)}</span></div>
      <div class="row small" style="margin:6px 0">
        ${l.late ? `<span class="tag warn">поздний: ${l.left} дн. вместо ${l.need}</span>` : ''}
        ${o.note ? `<span class="tag">комментарий</span>` : ''}
        ${o.source === 'manager' ? '<span class="tag">принят по телефону</span>' : ''}</div>
      ${o.note ? `<p class="small">«${esc(o.note)}»</p>` : ''}
      <div class="scroll">${orderLines(o)}</div>
      <div class="row" style="margin-top:10px"><button class="b p s" data-acc="${o.id}">Принять</button><button class="b s danger" data-rej="${o.id}">Отклонить</button></div>
    </div>`; }).join('') : '<div class="empty">Всё решено.</div>'}

    <h2>Нет заказа на ближайшую неделю <span class="tag ${silent.length ? 'warn' : 'ok'}">${silent.length}</span></h2>
    <div class="card">${silent.length ? `<table><tbody>${silent.map(c => `<tr>
      <td>${esc(c.name)}<div class="muted small">${c.type}${S.reminded[c.id] ? ` · напоминание отправлено ${fmt(S.reminded[c.id])}` : ''}</div></td>
      <td class="n"><button class="b s" data-rem="${c.id}">Напомнить</button> <button class="b s" data-call="${c.id}">Принять по телефону</button></td>
    </tr>`).join('')}</tbody></table>` : '<div class="empty">У всех клиентов есть заказ.</div>'}</div>

    <h2>Заявки для 1С <span class="tag">${for1c.length}</span></h2>
    <p class="muted small">Наименования и холодильники взяты из списка — переносить в 1С без перепечатки названий. После загрузки из файла этот шаг уйдёт.</p>
    ${for1c.length ? `<div class="row" style="margin-bottom:10px"><button class="b" id="csv">Скачать CSV для 1С</button></div>` + for1c.map(o => `<div class="card">
      <div class="row"><b class="grow">${esc(C(o.clientId).name)}</b><span>отгрузка ${fmt(o.shipDate)}</span></div>
      <div class="scroll" style="margin-top:6px">${orderLines(o)}</div>
      <div class="row" style="margin-top:10px"><button class="b s" data-1c="${o.id}">Внесено в 1С ✓</button></div>
    </div>`).join('') : '<div class="empty">Все заявки внесены.</div>'}`;

  document.querySelectorAll('[data-acc]').forEach(b => b.onclick = () => { S.orders.find(o => o.id === b.dataset.acc).status = 'accepted'; save(); render(); });
  document.querySelectorAll('[data-rej]').forEach(b => b.onclick = () => { S.orders.find(o => o.id === b.dataset.rej).status = 'rejected'; save(); render(); });
  document.querySelectorAll('[data-1c]').forEach(b => b.onclick = () => { S.orders.find(o => o.id === b.dataset['1c']).in1c = true; save(); render(); });
  document.querySelectorAll('[data-rem]').forEach(b => b.onclick = () => { S.reminded[b.dataset.rem] = today(); save(); toast('В демо напоминание никуда не отправляется'); render(); });
  document.querySelectorAll('[data-call]').forEach(b => b.onclick = () => { form = newForm(b.dataset.call, 'manager'); tab = 'client'; render(); });
  if ($('csv')) $('csv').onclick = () => downloadCsv(for1c);
}

function downloadCsv(orders) {
  const rows = [['Клиент', 'Дата отгрузки', 'Код', 'Наименование', 'Количество', 'Ед.', 'Холодильник']];
  orders.forEach(o => o.items.forEach(i => { const p = P(i.productId); rows.push([C(o.clientId).name, o.shipDate, p.code, p.name, num(i.qty), p.unit, FRIDGES[p.fridge]]); }));
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], {type: 'text/csv;charset=utf-8'}));
  a.download = `zayavki-${today()}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---------- производство ----------
function renderProd() {
  const t = today();
  const days = Array.from({length: 7}, (_, i) => addDays(t, i));
  const active = S.orders.filter(o => o.status !== 'rejected' && o.shipDate >= t);
  $('app').innerHTML = `<p class="muted">Что отгружать в ближайшие 7 дней. Заказы, которые ещё ждут решения менеджера, помечены отдельно.</p>` + days.map(d => {
    const os = active.filter(o => o.shipDate === d);
    if (!os.length) return `<h2>${fmt(d)}</h2><div class="empty">Отгрузок нет.</div>`;
    const late = os.filter(o => lateness(o).late).length;
    const pending = os.filter(o => o.status === 'review').length;
    const sum = {};
    os.forEach(o => o.items.forEach(i => {
      const s = sum[i.productId] || (sum[i.productId] = {qty: 0, pending: 0, clients: new Set()});
      if (o.status === 'review') s.pending += i.qty; else s.qty += i.qty;
      s.clients.add(o.clientId);
    }));
    const ids = Object.keys(sum).sort((a, b) => P(a).fridge.localeCompare(P(b).fridge) || P(a).code.localeCompare(P(b).code));
    return `<h2>${fmt(d)} <span class="muted small">· заказов: ${os.length}</span>
      ${late ? `<span class="tag warn">поздних: ${late}</span>` : ''} ${pending ? `<span class="tag">ждут решения: ${pending}</span>` : ''}</h2>
      <div class="card scroll"><table><thead><tr><th>Холод.</th><th>Наименование</th><th class="n">Подтверждено, кг</th><th class="n">Ждёт решения, кг</th><th class="n">Клиентов</th></tr></thead><tbody>${
        ids.map(id => { const p = P(id), s = sum[id]; return `<tr><td>${short(p.fridge)}</td><td>${esc(p.name)}</td><td class="n"><b>${num(s.qty)}</b></td><td class="n muted">${s.pending ? num(s.pending) : '—'}</td><td class="n">${s.clients.size}</td></tr>`; }).join('')
      }</tbody></table></div>`;
  }).join('');
}

// ---------- возвраты ----------
function renderReturns() {
  const since = addDays(today(), -30);
  const rs = S.returns.filter(r => r.date >= since);
  const stat = key => {
    const m = {};
    rs.forEach(r => { const k = key(r); m[k] = (m[k] || 0) + r.qty; });
    return Object.entries(m).sort((a, b) => b[1] - a[1]);
  };
  const statTable = (title, rows) => `<div class="card"><b>${title}</b><table><tbody>${
    rows.length ? rows.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="n">${num(v)} кг</td></tr>`).join('') : '<tr><td class="muted">Нет данных</td></tr>'
  }</tbody></table></div>`;

  $('app').innerHTML = `
    <h2>Записать возврат</h2>
    <div class="card"><div class="grid2">
      <div><label class="f" for="rClient">Клиент</label><select id="rClient">${S.clients.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
      <div><label class="f" for="rProd">Товар</label><select id="rProd">${S.products.map(p => `<option value="${p.id}">${esc(p.name)} · ${p.code}</option>`).join('')}</select></div>
      <div><label class="f" for="rQty">Количество, кг</label><input id="rQty" type="number" inputmode="decimal" min="0" step="0.5"></div>
      <div><label class="f" for="rReason">Причина</label><select id="rReason">${REASONS.map(r => `<option>${r}</option>`).join('')}</select></div>
    </div><div style="margin-top:12px"><button class="b p" id="rSave">Записать</button></div></div>

    <h2>Статистика за 30 дней <span class="muted small">· всего ${num(rs.reduce((s, r) => s + r.qty, 0))} кг</span></h2>
    <div class="grid2">
      ${statTable('По причинам', stat(r => r.reason))}
      ${statTable('По товарам', stat(r => P(r.productId).name))}
      ${statTable('По клиентам', stat(r => C(r.clientId).name))}
      <div class="card"><b>Последние возвраты</b><table><tbody>${
        rs.slice().sort((a, b) => a.date < b.date ? 1 : -1).slice(0, 8).map(r => `<tr><td>${fmt(r.date)}</td><td>${esc(C(r.clientId).name)}<div class="muted small">${esc(P(r.productId).name)} · ${esc(r.reason)}</div></td><td class="n">${num(r.qty)} кг</td></tr>`).join('')
      }</tbody></table></div>
    </div>`;

  $('rSave').onclick = () => {
    const qty = parseFloat($('rQty').value.replace(',', '.'));
    if (!(qty > 0)) return toast('Укажите количество');
    S.returns.push({id: uid('r'), clientId: $('rClient').value, date: today(), productId: $('rProd').value, qty, reason: $('rReason').value});
    save(); toast('Возврат записан'); render();
  };
}

// ---------- о демо ----------
function renderAbout() {
  $('app').innerHTML = `<div class="card">
    <h2>Что это</h2>
    <p>Демо помощника для приёма заказов. Клиенты, товары и заказы выдуманы. Данные хранятся только в этом браузере и никуда не отправляются.</p>
    <h2>Что попробовать</h2>
    <ol>
      <li><b>Заказ клиента</b>: подставляется прошлый заказ, товар выбирается только из списка, холодильник — сам. Поставьте дату отгрузки через 1–2 дня — заказ станет поздним.</li>
      <li><b>Менеджер</b>: поздние заказы и заказы с комментарием ждут решения. Ниже — кому напомнить и заявки для 1С с готовым CSV.</li>
      <li><b>Производство</b>: сводка по дням и позициям на неделю вперёд.</li>
      <li><b>Возвраты</b>: запись в три поля и статистика по причинам, товарам и клиентам.</li>
    </ol>
    <h2>Сбросить демо</h2>
    <p class="muted small">Вернуть исходные выдуманные данные.</p>
    <button class="b danger" id="reset">Сбросить</button>
  </div>`;
  $('reset').onclick = () => { S = seed(); save(); form = null; toast('Данные сброшены'); render(); };
}

render();
</script>
</body>
